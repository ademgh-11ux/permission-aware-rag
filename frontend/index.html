<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AdemPro Assistant</title>
    </head>
    <body>
        <header>
            <h1 class="column">AdemPro Assistant</h1>
        </header>
        <div id="message" aria-live="polite" class="column">
            <div class="bubble assistant">Hi! I'm AdemPro Assistant. How can I help you today?</div>
        </div>
        <footer class="column">
            <!--must match ChatRequest.question in main.py..-->
            <input id="question" placeholder="Ask AdemPro anything" autofocus maxlength="1000" aria-label="Your question" />
            <button id="send">Send</button>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>   
        <script src="app.js"></script>

    </body>
</html>
